name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: verify_provenance.py checks that every result's git_commit
          # exists in the repo, which a shallow clone cannot answer.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU torch and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip freeze

      - name: Unit tests (all of tests/)
        run: python -m pytest -q

      - name: Verify result provenance
        run: python scripts/verify_provenance.py results
